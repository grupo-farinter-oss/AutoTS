[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "autots"
version = "1.0.4"
authors = [
  { name="Colin Catlin", email="colin.catlin@gmail.com" },
]
description = "Automated Time Series Forecasting"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT License"}
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
keywords = ["forecasting", "time series", "anomaly detection", "automated machine learning", "mcp"]
dependencies = [
    "numpy>=1.21.6",
    "pandas>=1.1.0",
    "statsmodels>=0.13.0",
    "scikit-learn>=1.0.0",
]
[project.optional-dependencies]
additional = [
	"holidays>=0.9",
	'prophet>=1.0.0',
	'fredapi',
	'tensorflow',
	'xgboost>=1.6',
	'lightgbm',
	'joblib',
	'scipy',
	'arch',
	'numexpr',
	'bottleneck',
	'yfinance',
	'pytrends',
	'matplotlib',
	'requests',
	'seaborn',
]
mcp = [
	"holidays>=0.9",
	'fredapi',
	"openpyxl>=3.1.5,<3.2",
	'lightgbm',
	'joblib',
	'scipy',
	'numexpr',
	'bottleneck',
	'yfinance',
	'pytrends',
	'matplotlib',
	'requests',
	'seaborn',
	"mcp>=1.0.0",
]

[project.scripts]
autots-mcp = "autots.mcp.server:serve"

[project.urls]
"Homepage" = "https://github.com/winedarksea/AutoTS"
"Bug Tracker" = "https://github.com/winedarksea/AutoTS/issues"

[tool.setuptools.packages.find]
include = ["autots*"]
exclude = ["build*", "dist*", "tests*"]

[tool.setuptools.package-data]
"autots.mcp" = ["*.json", "*.md"]
"autots.datasets.data" = ["*.zip"]

[tool.setuptools]
include-package-data = true

[tool.uv]
# Solo afecta al uv.lock del entorno de desarrollo: "mcp" exige Python>=3.10 y tensorflow
# no tiene ruedas para 3.14/emscripten,
# pero el paquete publicado sigue soportando >=3.9 (requires-python no cambia).
environments = [
	"python_full_version >= '3.10' and python_full_version < '3.14' and sys_platform == 'linux'",
	"python_full_version >= '3.10' and python_full_version < '3.14' and sys_platform == 'darwin'",
	"python_full_version >= '3.10' and python_full_version < '3.14' and sys_platform == 'win32'",
]
# El código aún no es compatible con pandas 3 (fallan tests/test_seasonal.py); solo restringe el lock de desarrollo.
constraint-dependencies = [
	"pandas<3",
	# autots/mcp/server.py usa la API de decoradores de mcp 1.x (@app.list_tools), retirada en mcp 2.
	"mcp<2",
]
